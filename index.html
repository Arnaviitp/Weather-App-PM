<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2a2a40);
        color: #fff;
        margin: 0;
        padding: 0;
        transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
        max-width: 900px;
        margin: 50px auto;
        padding: 30px;
        background: rgba(255, 255, 255, 0.07);
        backdrop-filter: blur(15px);
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px);} 
        to { opacity: 1; transform: translateY(0);} 
    }

    h1 {
        text-align: center;
        font-size: 2.6rem;
        margin-bottom: 20px;
        color: #ffcd4b;
    }

    button {
        padding: 12px 25px;
        background: #ffcd4b;
        border: none;
        border-radius: 12px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    button:hover {
        background: #ffdb70;
        transform: translateY(-2px);
    }

    .output {
        margin-top: 25px;
        padding: 20px;
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        min-height: 120px;
        line-height: 1.6;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 1.2rem;
    }

    /* Loading Skeleton */
    .skeleton {
        width: 100%;
        height: 25px;
        background: linear-gradient(90deg, #444, #666, #444);
        background-size: 200% 100%;
        border-radius: 8px;
        animation: loading 1.5s infinite;
        margin: 8px 0;
    }

    @keyframes loading {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
    }

    /* Dark mode toggle */
    .toggle {
        position: absolute;
        top: 20px;
        right: 20px;
        cursor: pointer;
        width: 45px;
    }
</style>
</head>
<body>
  <div class="container">
    <h2>Weather App</h2>
    <p><strong>Built by: Arnav Anand</strong></p>
    <button onclick="showInfo()" style="background:#16a34a; padding:8px 14px; border-radius:6px; color:white; border:none; cursor:pointer; margin-bottom:10px;">About PM Accelerator</button>
    <p>Enter city / ZIP / landmark / coordinates (lat,lon)</p>

    <div style="display:flex; gap:10px;">
      <input id="locationInput" placeholder="e.g. Delhi, 10001, Taj Mahal, 19.07,72.87" style="flex:1;" />
      <button onclick="searchWeather()">Search</button>
      <button onclick="useMyLocation()" style="background:#444;">Use My Location</button>
    </div>

    <div id="status" style="margin-top:10px; color:#555;"></div>
    <div id="error" style="margin-top:10px; color:red;"></div>

    <div id="currentWeather" class="weather-box" style="display:none;"></div>
    <div id="forecast" class="forecast-box" style="display:none;"></div>
  </div>

  <script>
    const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
    const WEATHER = "https://api.open-meteo.com/v1/forecast";

    function weatherIcon(code) {
      const map = {
        0: "☀️", 1: "🌤️", 2: "⛅", 3: "☁️",
        45: "🌫️", 48: "🌫️",
        51: "🌦️", 53: "🌦️", 55: "🌧️",
        61: "🌧️", 63: "🌧️", 65: "⛈️",
        71: "🌨️", 73: "🌨️", 75: "❄️",
        95: "⛈️"
      };
      return map[code] || "🌈";
    }

    function resetUI() {
      document.getElementById("status").innerText = "";
      document.getElementById("error").innerText = "";
      document.getElementById("currentWeather").style.display = "none";
      document.getElementById("forecast").style.display = "none";
    }

    async function searchWeather() {
      resetUI();
      const q = document.getElementById("locationInput").value.trim();
      if (!q) return (document.getElementById("error").innerText = "Enter a location.");

      const coord = q.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
      if (coord) {
        fetchWeather(parseFloat(coord[1]), parseFloat(coord[2]), q);
        return;
      }

      document.getElementById("status").innerText = "Resolving location...";
      try {
        const res = await fetch(`${GEOCODE}?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
        const data = await res.json();
        if (!data.results || data.results.length === 0) throw new Error("Location not found.");

        const place = data.results[0];
        const name = `${place.name}, ${place.country}`;

        fetchWeather(place.latitude, place.longitude, name);
      } catch (err) {
        document.getElementById("error").innerText = err.message;
      }
    }

    async function fetchWeather(lat, lon, name) {
      document.getElementById("status").innerText = "Fetching weather...";
      try {
        const url = `${WEATHER}?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=5`;
        const res = await fetch(url);
        const data = await res.json();

        showCurrentWeather(data.current_weather, name);
        showForecast(data.daily);
        document.getElementById("status").innerText = "";
      } catch (err) {
        document.getElementById("error").innerText = "Failed to fetch weather.";
      }
    }

    function showCurrentWeather(c, name) {
      const box = document.getElementById("currentWeather");
      box.style.display = "block";
      box.innerHTML = `
        <h3>${name}</h3>
        <div style="font-size:40px">${weatherIcon(c.weathercode)}</div>
        <h2>${Math.round(c.temperature)}°C</h2>
        <p>Wind: ${c.windspeed} km/h<br>Direction: ${c.winddirection}°</p>
      `;
    }

    function showForecast(d) {
      const box = document.getElementById("forecast");
      box.style.display = "block";

      let cards = "";
      for (let i = 0; i < d.time.length; i++) {
        cards += `
          <div class="card">
            <div>${new Date(d.time[i]).toDateString()}</div>
            <div class="emoji">${weatherIcon(d.weathercode[i])}</div>
            <div>High: ${Math.round(d.temperature_2m_max[i])}°C</div>
            <div>Low: ${Math.round(d.temperature_2m_min[i])}°C</div>
            <div style="font-size:12px; color:#444">Precip: ${d.precipitation_sum[i]} mm</div>
          </div>
        `;
      }

      box.innerHTML = `<h3>5-Day Forecast</h3><div class="forecast-cards">${cards}</div>`;
    }

    function useMyLocation() {
      resetUI();
      if (!navigator.geolocation) return (document.getElementById("error").innerText = "Geolocation not supported.");

      document.getElementById("status").innerText = "Detecting your location...";
      navigator.geolocation.getCurrentPosition(
        pos => {
          fetchWeather(pos.coords.latitude, pos.coords.longitude, "Your Location");
        },
        err => {
          document.getElementById("error").innerText = err.message;
        }
      );
    }
      function showInfo() {
      alert(`PM Accelerator Program:

The Product Manager Accelerator Program is designed to support PM professionals through every stage of their careers. From students seeking entry-level positions to Directors aiming for leadership roles, the program has successfully helped hundreds achieve their career goals.

Our community is ambitious, committed, and continuously growing. Through the program, members learn, refine, and develop strong PM and leadership skills that form the foundation of their future success.`);
    }
  </script>
</body>
</html>
