<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(
          135deg,
          #ff7eb3,
          #ff758c,
          #ffb86c,
          #8be9fd,
          #6272a4
        );
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
        color: #fff;
        margin: 0;
        padding: 0;
      }

      @keyframes gradientBG {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      .container {
        max-width: 950px;
        margin: 50px auto;
        padding: 30px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        backdrop-filter: blur(12px);
        animation: fadeIn 1s ease, shine 5s infinite alternate;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
        }
      }

      @keyframes shine {
        0% {
          box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
        }
        100% {
          box-shadow: 0 0 35px rgba(255, 255, 255, 0.3);
        }
      }

      h1 {
        font-size: 2.5rem;
        text-align: center;
        font-weight: 700;
        margin: 0;
      }

      .sub {
        text-align: center;
        margin-top: 5px;
        font-size: 1.05rem;
        opacity: 0.85;
      }

      .top-buttons {
        display: flex;
        justify-content: center;
        margin-top: 15px;
        gap: 15px;
      }

      .btn {
        background: #ffcd4b;
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
        font-weight: 600;
      }

      .btn:hover {
        background: #ffe189;
        transform: translateY(-3px);
      }

      input {
        padding: 12px;
        border-radius: 10px;
        border: none;
        flex: 1;
        font-size: 1rem;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      #status {
        color: #eee;
        margin-top: 8px;
      }

      #error {
        color: rgb(255, 80, 80);
        margin-top: 8px;
      }

      .weather-section {
        margin-top: 25px;
        padding: 20px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.15);
      }

      .forecast-cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }

      .card {
        padding: 15px;
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.18);
        text-align: center;
        backdrop-filter: blur(10px);
        transition: 0.3s;
      }

      .card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(255, 215, 110, 0.4);
      }

      .emoji {
        font-size: 38px;
        margin: 10px 0;
        animation: float 2.5s infinite ease-in-out;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-7px);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Weather App</h1>
      <p class="sub">Built by <strong>Arnav Anand</strong></p>

      <!-- Top Buttons -->
      <div class="top-buttons">
        <button class="btn" onclick="showInfo()">ℹ️ Info</button>
      </div>

      <p style="margin-top: 20px">Enter city / ZIP / landmark / coordinates</p>

      <div class="actions">
        <input
          id="locationInput"
          placeholder="e.g. Delhi, 10001, Taj Mahal, 19.07,72.87"
        />
        <button class="btn" onclick="searchWeather()">Search</button>
        <button class="btn" style="background:#444;color:white" onclick="useMyLocation()">
          Use My Location
        </button>
      </div>

      <div id="status"></div>
      <div id="error"></div>

      <div id="currentWeather" class="weather-section" style="display: none"></div>

      <div id="forecast" class="weather-section" style="display: none"></div>
    </div>

    <script>
      const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
      const WEATHER = "https://api.open-meteo.com/v1/forecast";

      function weatherIcon(code) {
        const map = {
          0: "☀️",
          1: "🌤️",
          2: "⛅",
          3: "☁️",
          45: "🌫️",
          48: "🌫️",
          51: "🌦️",
          53: "🌦️",
          55: "🌧️",
          61: "🌧️",
          63: "🌧️",
          65: "⛈️",
          71: "🌨️",
          73: "🌨️",
          75: "❄️",
          95: "⛈️",
        };
        return map[code] || "🌈";
      }

      function resetUI() {
        document.getElementById("status").innerText = "";
        document.getElementById("error").innerText = "";
        document.getElementById("currentWeather").style.display = "none";
        document.getElementById("forecast").style.display = "none";
      }

      async function searchWeather() {
        resetUI();
        const q = document.getElementById("locationInput").value.trim();
        if (!q) return (document.getElementById("error").innerText = "Enter a location.");

        const coord = q.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
        if (coord) {
          fetchWeather(parseFloat(coord[1]), parseFloat(coord[2]), q);
          return;
        }

        document.getElementById("status").innerText = "Resolving location...";

        try {
          const res = await fetch(`${GEOCODE}?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
          const data = await res.json();

          if (!data.results || data.results.length === 0)
            throw new Error("Location not found.");

          const place = data.results[0];
          const name = `${place.name}, ${place.country}`;

          fetchWeather(place.latitude, place.longitude, name);
        } catch (err) {
          document.getElementById("error").innerText = err.message;
        }
      }

      async function fetchWeather(lat, lon, name) {
        document.getElementById("status").innerText = "Fetching weather...";

        try {
          const url = `${WEATHER}?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&forecast_days=5`;

          const res = await fetch(url);
          const data = await res.json();

          showCurrentWeather(data.current_weather, name);
          showForecast(data.daily);

          document.getElementById("status").innerText = "";
        } catch (err) {
          document.getElementById("error").innerText = "Failed to fetch weather.";
        }
      }

      function showCurrentWeather(c, name) {
        const box = document.getElementById("currentWeather");
        box.style.display = "block";
        box.innerHTML = `
          <h2>${name}</h2>
          <div style="font-size:40px">${weatherIcon(c.weathercode)}</div>
          <h2>${Math.round(c.temperature)}°C</h2>
          <p>Wind: ${c.windspeed} km/h</p>
          <p>Direction: ${c.winddirection}°</p>
        `;
      }

      function showForecast(d) {
        const box = document.getElementById("forecast");
        box.style.display = "block";

        let cards = "";
        for (let i = 0; i < d.time.length; i++) {
          cards += `
            <div class="card">
              <strong>${new Date(d.time[i]).toDateString()}</strong>
              <div class="emoji">${weatherIcon(d.weathercode[i])}</div>
              <div>High: ${Math.round(d.temperature_2m_max[i])}°C</div>
              <div>Low: ${Math.round(d.temperature_2m_min[i])}°C</div>
              <div style="font-size:13px; opacity:0.7">Precip: ${d.precipitation_sum[i]} mm</div>
            </div>
          `;
        }

        box.innerHTML = `<h2>5-Day Forecast</h2><div class="forecast-cards">${cards}</div>`;
      }

      function useMyLocation() {
        resetUI();
        if (!navigator.geolocation)
          return (document.getElementById("error").innerText = "Geolocation not supported.");

        document.getElementById("status").innerText = "Detecting location...";

        navigator.geolocation.getCurrentPosition(
          (pos) => {
            fetchWeather(pos.coords.latitude, pos.coords.longitude, "Your Location");
          },
          (err) => {
            document.getElementById("error").innerText = err.message;
          }
        );
      }

      function showInfo() {
        alert(
`PM Accelerator:

The Product Manager Accelerator Program is designed to support PM professionals through every stage of their careers.

From students seeking entry-level positions to Directors aiming for leadership roles, the program has successfully helped hundreds achieve their career goals.

Our community is ambitious, committed, and continuously growing. Through the program, members learn, refine, and develop strong PM and leadership skills that form the foundation of their future success.`
        );
      }
    </script>
  </body>
</html>
