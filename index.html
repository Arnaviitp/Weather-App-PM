<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Weather App</title>

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 950px;
      margin: 50px auto;
      padding: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      animation: fadeIn .8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 { text-align: center; font-size: 3rem; }

    /* Input Box */
    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ffcc00;
      font-size: 1.1rem;
      margin-left: 6px;
      font-weight: bold;
    }

    button:hover {
      background: #ffe066;
    }

    /* Autosuggest Dropdown */
    #suggestions {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 10px;
      border-radius: 10px;
      margin-top: 4px;
      display: none;
      position: absolute;
      width: 92%;
      z-index: 10;
    }

    .suggest-item {
      padding: 8px;
      cursor: pointer;
      border-radius: 6px;
    }

    .suggest-item:hover {
      background: rgba(255,255,255,0.3);
    }

    .weather-card, .detail-card {
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .forecast-card {
      background: rgba(255,255,255,0.15);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      transition: 0.3s;
      box-shadow: 0 6px 15px rgba(0,0,0,0.25);
    }

    .forecast-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(255,215,0,0.5);
    }

    .emoji { font-size: 45px; }

    /* Loader */
    .loader {
      margin-top: 15px;
      width: 45px;
      height: 45px;
      border: 6px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      display: none;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Clock */
    .clock-box {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Weather App</h1>
    <div class="clock-box" id="clock"></div>

    <!-- Input + Buttons -->
    <div style="display:flex; gap:10px; position:relative;">
      <input id="locationInput" placeholder="Delhi, 10001, Taj Mahal, 19.07,72.87" oninput="autoSuggest()">
      <button onclick="searchWeather()">Search</button>
      <button onclick="useMyLocation()" style="background:#444;color:white;">📍</button>
    </div>
    <div id="suggestions"></div>

    <div class="loader" id="loader"></div>

    <div id="error" style="color:#ff3333; margin-top:10px;"></div>

    <div id="currentWeather" class="weather-card" style="display:none;"></div>
    <div id="details" class="detail-card" style="display:none;"></div>

    <h2 style="text-align:center; margin-top:20px;">Forecast</h2>
    <div id="forecast" class="forecast-grid"></div>
  </div>

<script>
const GEOCODE = "https://geocoding-api.open-meteo.com/v1/search";
const WEATHER = "https://api.open-meteo.com/v1/forecast";
const AIR = "https://air-quality-api.open-meteo.com/v1/air-quality";

/*---------------- AUTO CLOCK ----------------*/
setInterval(() => {
  document.getElementById("clock").innerText = new Date().toLocaleString();
}, 1000);

/*---------------- AUTOSUGGEST ----------------*/
async function autoSuggest() {
  const q = locationInput.value.trim();
  if (q.length < 2) { document.getElementById("suggestions").style.display = "none"; return; }

  const url = `${GEOCODE}?name=${q}&count=5&language=en`;

  const res = await fetch(url);
  const data = await res.json();
  const box = document.getElementById("suggestions");

  if (!data.results) { box.style.display = "none"; return; }

  let html = "";
  data.results.forEach(p => {
    html += `<div class="suggest-item" onclick="selectSuggestion('${p.name}, ${p.country}')">${p.name}, ${p.country}</div>`;
  });

  box.innerHTML = html;
  box.style.display = "block";
}

function selectSuggestion(name) {
  document.getElementById("locationInput").value = name;
  document.getElementById("suggestions").style.display = "none";
}

/*---------------- SEARCH WEATHER ----------------*/
async function searchWeather() {
  document.getElementById("error").innerText = "";
  const q = locationInput.value.trim();
  if (!q) return;

  document.getElementById("loader").style.display = "block";

  const coord = q.match(/^(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)$/);
  if (coord) return fetchWeather(parseFloat(coord[1]), parseFloat(coord[2]), "Chosen Location");

  const res = await fetch(`${GEOCODE}?name=${q}&count=1&language=en`);
  const data = await res.json();

  if (!data.results) {
    document.getElementById("error").innerText = "Location not found!";
    return;
  }

  const p = data.results[0];
  fetchWeather(p.latitude, p.longitude, `${p.name}, ${p.country}`);
}

/*---------------- FETCH WEATHER ----------------*/
async function fetchWeather(lat, lon, name) {
  const url = `${WEATHER}?latitude=${lat}&longitude=${lon}&current_weather=true&daily=sunrise,sunset,weathercode,temperature_2m_max,temperature_2m_min&hourly=uv_index,relative_humidity_2m,pressure_msl&timezone=auto&forecast_days=5`;

  const airUrl = `${AIR}?latitude=${lat}&longitude=${lon}&hourly=pm10,pm2_5,us_aqi&timezone=auto`;

  const res = await fetch(url);
  const data = await res.json();

  const airRes = await fetch(airUrl);
  const air = await airRes.json();

  document.getElementById("loader").style.display = "none";

  showCurrentWeather(data.current_weather, data.daily, name);
  showDetails(data.hourly, air.hourly);
  showForecast(data.daily);
}

/*---------------- CURRENT WEATHER ----------------*/
function showCurrentWeather(c, d, name) {
  document.getElementById("currentWeather").style.display = "block";

  const sunrise = d.sunrise[0].split("T")[1];
  const sunset = d.sunset[0].split("T")[1];

  document.getElementById("currentWeather").innerHTML = `
    <h2>${name}</h2>
    <div class="emoji">${weatherEmoji(c.weathercode)}</div>
    <h1>${Math.round(c.temperature)}°C</h1>
    <p>Wind: ${c.windspeed} km/h | Direction: ${c.winddirection}°</p>
    <p>Sunrise: ${sunrise} ⛅ | Sunset: ${sunset} 🌙</p>
  `;
}

/*---------------- EXTRA DETAILS ----------------*/
function showDetails(h, a) {
  document.getElementById("details").style.display = "block";

  const humidity = h.relative_humidity_2m[0];
  const pressure = Math.round(h.pressure_msl[0]);
  const uv = h.uv_index[0];

  const aqi = a.us_aqi[0];

  document.getElementById("details").innerHTML = `
    <h3>More Weather Details</h3>
    <p>Humidity: ${humidity}%</p>
    <p>Pressure: ${pressure} hPa</p>
    <p>UV Index: ${uv}</p>
    <p><strong>AQI: ${aqi}</strong> ${aqiLevel(aqi)}</p>
  `;
}

/* AQI Text */
function aqiLevel(aqi) {
  if (aqi <= 50) return "🟢 Good";
  if (aqi <= 100) return "🟡 Moderate";
  if (aqi <= 150) return "🟠 Unhealthy for some";
  return "🔴 Very Unhealthy";
}

/*---------------- FORECAST ----------------*/
function showForecast(d) {
  const box = document.getElementById("forecast");
  box.innerHTML = "";

  for (let i = 0; i < d.time.length; i++) {
    box.innerHTML += `
      <div class="forecast-card">
        <b>${new Date(d.time[i]).toDateString()}</b>
        <div class="emoji">${weatherEmoji(d.weathercode[i])}</div>
        <p>High: ${Math.round(d.temperature_2m_max[i])}°C</p>
        <p>Low: ${Math.round(d.temperature_2m_min[i])}°C</p>
      </div>
    `;
  }
}

/* Emoji Map */
function weatherEmoji(code) {
  const map = {
    0:"☀️",1:"🌤️",2:"⛅",3:"☁️",
    45:"🌫️",48:"🌫️",
    51:"🌦️",53:"🌧️",55:"🌧️",
    61:"🌧️",63:"🌧️",65:"⛈️",
    71:"🌨️",73:"🌨️",75:"❄️",
    95:"⛈️"
  };
  return map[code] || "🌈";
}

/*---------------- USE MY LOCATION ----------------*/
function useMyLocation() {
  if (!navigator.geolocation) return alert("Location not supported");

  navigator.geolocation.getCurrentPosition(pos => {
    fetchWeather(pos.coords.latitude, pos.coords.longitude, "Your Location");
  });
}
</script>

</body>
</html>
